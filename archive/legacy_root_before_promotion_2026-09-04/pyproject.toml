[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoident-reproduction"
version = "0.1.0"
description = "Reproducible distribution-grid topology identification experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "terminal_load_only_case33"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
