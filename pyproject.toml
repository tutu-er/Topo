[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-load-only-case33"
version = "0.1.0"
description = "Terminal-load-only IEEE case33 topology-identification scenarios"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "networkx", "matplotlib", "PyYAML"]

[tool.setuptools.packages.find]
include = ["terminal_case33*", "experiments*", "research_experiments*"]
exclude = ["research_experiments.tests*"]

[tool.pytest.ini_options]
testpaths = ["rnj_wzzt_core/tests", "tests", "research_experiments/tests"]
pythonpath = [".", "rnj_wzzt_core"]
